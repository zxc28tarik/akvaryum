name: Canlı detay gözlemci döngüsü düzeltmesini uygula

on:
  push:
    branches: [agent/browser-flow-regression-audit]
    paths:
      - scripts/apply-detail-observer-loop-fix.mjs
      - .github/workflows/apply-detail-observer-loop-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: agent/browser-flow-regression-audit
          fetch-depth: 0
      - name: Node.js kur
        uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          package-manager-cache: false
      - name: Düzeltmeyi uygula
        run: node scripts/apply-detail-observer-loop-fix.mjs
      - name: Kalıcı değişikliği kaydet
        shell: bash
        run: |
          if git diff --quiet -- inhabitant-detail.jsx; then
            echo "Uygulanacak değişiklik yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inhabitant-detail.jsx
          git commit -m "fix: canlı detay MutationObserver döngüsünü engelle"
          git pull --rebase origin agent/browser-flow-regression-audit
          git push origin HEAD:agent/browser-flow-regression-audit